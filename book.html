<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集電子書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1F1F; --teal:#1B4B4B; --teal-bright:#2E9A9A;
    --gold:#E0A96D; --paper:#F4F1EA; --slate:#6B7A78;
    --line:rgba(14,31,31,.12); --line-strong:rgba(14,31,31,.24);
    --serif-en:"Playfair Display",Georgia,serif;
    --sans:"Noto Sans TC","Helvetica Neue",-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:var(--sans); color:var(--ink);
    background:#FFFFFF;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; transition:opacity .5s ease;
  }
  body.is-ready{ opacity:1; }
  body.is-leaving{ opacity:0; }

  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:12px; padding:18px 24px; font-family:var(--sans); color:var(--ink);
  }
  .back-link{
    text-decoration:none; font-size:12px; letter-spacing:.15em; text-transform:uppercase;
    display:flex; align-items:center; gap:8px; opacity:.75; transition:opacity .2s;
    justify-self:start; white-space:nowrap; color:var(--ink);
  }
  .back-link:hover{ opacity:1; }

  .book-title{
    font-family:var(--serif-en); font-weight:600; font-size:16px; letter-spacing:.02em;
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    justify-self:center; max-width:100%;
  }

  .page-indicator{
    font-size:11px; letter-spacing:.15em; opacity:.55; font-variant-numeric:tabular-nums;
    justify-self:end; white-space:nowrap;
  }

  #viewer{
    display:flex; align-items:center; justify-content:center;
    width:100vw; height:100vh; padding:90px 100px;
  }
  #page-img{
    max-width:100%; max-height:100%; width:auto; height:auto;
    display:block; background:#FBFAF6;
    opacity:0; transition:opacity .45s ease;
  }
  #page-img.is-visible{ opacity:1; }

  .nav-btn{
    position:fixed; top:50%; transform:translateY(-50%);
    width:48px; height:48px; border-radius:50%; border:1px solid var(--line-strong);
    background:rgba(14,31,31,.05); color:var(--ink);
    box-shadow:0 2px 14px rgba(14,31,31,.08);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    z-index:15; transition:background .2s, opacity .2s; opacity:.6;
    font-family:var(--serif-en); font-size:20px; user-select:none;
  }
  .nav-btn:hover{ background:rgba(14,31,31,.1); opacity:1; }
  .nav-btn.is-disabled{ opacity:.2; pointer-events:none; }
  #prev-btn{ left:20px; } #next-btn{ right:20px; }

  .loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--serif-en); font-size:13px; letter-spacing:.2em; text-transform:uppercase;
    opacity:.5; z-index:30;
  }
  .hidden{ display:none !important; }

  @media (max-width:640px){
    .topbar{ padding:14px 12px; gap:8px; }
    .back-link span.back-text{ display:none; }
    .book-title{ font-size:13px; }
    #viewer{ padding:70px 16px; }
    .nav-btn{ width:38px; height:38px; font-size:16px; }
    #prev-btn{ left:8px; } #next-btn{ right:8px; }
  }
</style>
</head>
<body>
  <div class="loading" id="loading">Loading —</div>

  <div class="topbar">
    <a class="back-link" href="index.html" id="back-link">&larr;<span class="back-text">&nbsp; Back</span></a>
    <div class="book-title" id="book-title"></div>
    <div class="page-indicator" id="page-indicator"></div>
  </div>

  <div id="viewer">
    <img id="page-img" alt="">
  </div>

  <div class="nav-btn" id="prev-btn">&#8249;</div>
  <div class="nav-btn" id="next-btn">&#8250;</div>

<script>
  // Shuttered Light's PDF has page 1 and the last page as single portrait
  // covers, and every page in between pre-composed as a full two-page
  // landscape spread. Rather than forcing everything into one fixed page
  // size (which either squashes the spreads or stretches the covers),
  // each image is shown at its own natural shape — the <img> just fits
  // within the available space, so covers read as a single page and
  // spreads read full-width automatically.
  const BOOKS = {
    "xiaode-photobook": { title: "Shuttered Light", dir: "images/xiaode-photobook", pages: 58 },
    "fragments-of-light": { title: "Fragments of Light", dir: "images/fragments-of-light", pages: 32 }
  };

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const cfg = BOOKS[id];

  function goTo(url) {
    document.body.classList.remove("is-ready");
    document.body.classList.add("is-leaving");
    setTimeout(() => { location.href = url; }, 380);
  }

  document.getElementById("back-link").addEventListener("click", (e) => {
    e.preventDefault();
    goTo("index.html");
  });

  if (!cfg) {
    document.body.innerHTML = '<p style="font-family:sans-serif;color:#0E1F1F;text-align:center;margin-top:40vh">找不到這本電子書。<a href="index.html" style="color:#2E9A9A">回書架</a></p>';
    requestAnimationFrame(() => document.body.classList.add("is-ready"));
  } else {
    document.getElementById("book-title").textContent = cfg.title;

    const total = cfg.pages;
    let currentIndex = 0;
    const img = document.getElementById("page-img");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    function pageSrc(i) {
      return `${cfg.dir}/page-${String(i + 1).padStart(2, "0")}.jpg`;
    }
    function preload(i) {
      if (i < 0 || i >= total) return;
      const im = new Image();
      im.src = pageSrc(i);
    }
    function updateChrome() {
      document.getElementById("page-indicator").textContent = `${currentIndex + 1} / ${total}`;
      prevBtn.classList.toggle("is-disabled", currentIndex === 0);
      nextBtn.classList.toggle("is-disabled", currentIndex === total - 1);
    }

    function showPage(newIndex, immediate) {
      newIndex = Math.max(0, Math.min(total - 1, newIndex));
      if (!immediate && newIndex === currentIndex) return;
      currentIndex = newIndex;
      updateChrome();
      preload(currentIndex + 1);
      preload(currentIndex - 1);

      const apply = () => {
        img.onload = () => {
          img.classList.add("is-visible");
          document.getElementById("loading").classList.add("hidden");
          requestAnimationFrame(() => document.body.classList.add("is-ready"));
        };
        img.src = pageSrc(currentIndex);
      };

      if (immediate) {
        apply();
      } else {
        img.classList.remove("is-visible");
        setTimeout(apply, 220);
      }
    }

    showPage(0, true);

    prevBtn.addEventListener("click", () => showPage(currentIndex - 1));
    nextBtn.addEventListener("click", () => showPage(currentIndex + 1));

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") showPage(currentIndex - 1);
      if (e.key === "ArrowRight") showPage(currentIndex + 1);
      if (e.key === "Escape") goTo("index.html");
    });

    // fallback: reveal the page anyway after 4s even if the image is slow
    setTimeout(() => {
      document.getElementById("loading").classList.add("hidden");
      document.body.classList.add("is-ready");
    }, 4000);
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集電子書</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='68' font-family='Georgia,serif' font-weight='700' font-size='50' fill='%23FFFFFF' text-anchor='middle'>LT</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1F1F; --teal:#1B4B4B; --teal-bright:#2E9A9A;
    --gold:#E0A96D; --paper:#F4F1EA; --slate:#6B7A78;
    --line:rgba(244,241,234,.14); --line-strong:rgba(244,241,234,.28);
    --fg:#E7ECEA; --fg-dim:#AEBAB7;
    --serif-en:"Playfair Display",Georgia,serif;
    --sans:"Noto Sans TC","Helvetica Neue",-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:var(--sans); color:var(--ink);
    background:#F5F1E9;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; transition:opacity .5s ease;
  }
  body.is-ready{ opacity:1; }
  body.is-leaving{ opacity:0; }

  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:12px; padding:18px 24px; font-family:var(--sans); color:var(--ink);
    background:#EEE7D8; box-shadow:0 1px 0 var(--line-strong);
  }
  .back-link{
    text-decoration:none; font-size:12px; letter-spacing:.15em; text-transform:uppercase;
    display:flex; align-items:center; gap:8px; opacity:.75; transition:opacity .2s;
    justify-self:start; white-space:nowrap; color:var(--ink);
  }
  .back-link:hover{ opacity:1; }

  .book-title{
    font-family:var(--serif-en); font-weight:400; font-size:16px; letter-spacing:.02em;
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    justify-self:center; max-width:100%;
  }

  .topbar-right{
    justify-self:end; display:flex; align-items:center; gap:14px;
  }
  .page-indicator{
    font-size:11px; letter-spacing:.15em; opacity:.55; font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .thumb-toggle{
    appearance:none; border:1px solid var(--teal); background:transparent;
    color:var(--ink); height:32px; padding:0 13px 0 10px; border-radius:16px; cursor:pointer;
    font-family:var(--sans); font-size:11px; letter-spacing:.08em;
    display:flex; align-items:center; gap:7px; white-space:nowrap;
    transition:border-color .2s, color .2s;
  }
  .thumb-toggle .icon{ font-size:13px; line-height:1; }
  .thumb-toggle:hover{ border-color:var(--teal-bright); color:var(--teal-bright); }
  .thumb-toggle.is-active{ border-color:var(--teal-bright); color:var(--teal-bright); }

  @keyframes thumb-pulse-ring{
    0%{ box-shadow:0 0 0 0 rgba(46,154,154,.55); }
    70%{ box-shadow:0 0 0 13px rgba(46,154,154,0); }
    100%{ box-shadow:0 0 0 0 rgba(46,154,154,0); }
  }
  .thumb-toggle.pulse{ animation:thumb-pulse-ring 1.5s ease-out 3; }

  #thumb-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.08); z-index:24;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  #thumb-backdrop.is-open{ opacity:1; pointer-events:auto; }

  #thumb-panel{
    position:fixed; top:0; right:0; height:100vh; width:200px; max-width:78vw;
    background:#EFE9DC; border-left:1px solid var(--line-strong);
    box-shadow:-10px 0 30px -18px rgba(14,31,31,.3);
    z-index:25; transform:translateX(100%); transition:transform .32s ease;
    overflow-y:auto; padding:76px 0 24px;
  }
  #thumb-panel.is-open{ transform:translateX(0); }
  .thumb-item{
    display:flex; align-items:center; gap:10px; padding:7px 16px; cursor:pointer;
    border-left:3px solid transparent; transition:background .15s, border-color .15s;
  }
  .thumb-item:hover{ background:rgba(14,31,31,.05); }
  .thumb-item.is-current{ border-left-color:var(--teal-bright); background:rgba(27,75,75,.09); }
  .thumb-item img{
    width:46px; height:auto; flex:none; background:#fff;
    box-shadow:0 2px 8px rgba(14,31,31,.18);
  }
  .thumb-item .thumb-num{
    font-family:var(--sans); font-size:11px; color:var(--slate);
    font-variant-numeric:tabular-nums;
  }
  .thumb-item.is-current .thumb-num{ color:var(--ink); font-weight:500; }

  #viewer{
    display:flex; align-items:center; justify-content:center;
    width:100vw; height:100vh; padding:90px 100px;
  }
  #page-img{
    max-width:100%; max-height:100%; width:auto; height:auto;
    display:block;
    box-shadow:0 24px 60px -24px rgba(14,31,31,.35);
    opacity:0; transition:opacity .45s ease;
  }
  #page-img.is-visible{ opacity:1; }

  #page-pair{
    display:none; align-items:stretch; justify-content:center;
    box-shadow:0 24px 60px -24px rgba(14,31,31,.35);
    opacity:0; transition:opacity .45s ease;
  }
  #page-pair.is-visible{ opacity:1; }
  #page-pair img{ display:block; height:100%; width:100%; object-fit:cover; }
  #page-pair .pair-divider{ width:1px; background:var(--line-strong); flex:none; }

  .nav-btn{
    position:fixed; top:50%; transform:translateY(-50%);
    width:48px; height:48px; border-radius:50%; border:1px solid var(--line-strong);
    background:rgba(14,31,31,.05); color:var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    z-index:15; transition:background .2s, opacity .2s; opacity:.6;
    font-family:var(--serif-en); font-size:20px; user-select:none;
  }
  .nav-btn:hover{ background:rgba(14,31,31,.1); opacity:1; }
  .nav-btn.is-disabled{ opacity:.2; pointer-events:none; }

  #lightbox{
    position:fixed; inset:0; z-index:60; background:rgba(8,12,12,.94);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    opacity:0; visibility:hidden; transition:opacity .3s ease, visibility .3s ease;
    touch-action:none; cursor:zoom-in; user-select:none;
  }
  #lightbox.open{ opacity:1; visibility:visible; }
  #lightbox.zoomed{ cursor:grab; }
  #lb-wrap{
    display:flex; align-items:center; justify-content:center;
    max-width:96vw; max-height:94vh; transform-origin:center center;
  }
  #lb-wrap img{ display:block; max-width:96vw; max-height:94vh; width:auto; height:auto; }
  #lb-wrap img:only-child{ max-width:96vw; }
  #lb-wrap img + img{ margin-left:1px; max-width:48vw; }
  #lb-wrap:has(img + img) img:first-child{ max-width:48vw; }
  #lb-close{
    position:absolute; top:16px; right:18px; z-index:2; width:40px; height:40px;
    border-radius:50%; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.06);
    color:#fff; font-size:16px; cursor:pointer;
  }
  #lb-hint{
    position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:11px;
    letter-spacing:.12em; color:rgba(255,255,255,.45); pointer-events:none;
  }
  #lightbox.zoomed #lb-hint{ opacity:0; }
  #prev-btn{ left:20px; } #next-btn{ right:20px; }

  .loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--serif-en); font-size:13px; letter-spacing:.2em; text-transform:uppercase;
    opacity:.5; z-index:30;
  }
  .hidden{ display:none !important; }

  @media (max-width:640px){
    .topbar{ padding:14px 12px; gap:8px; }
    .back-link span.back-text{ display:none; }
    .book-title{ font-size:13px; }
    .topbar-right{ gap:8px; }
    .thumb-toggle .label{ display:none; }
    .thumb-toggle{ padding:0; width:32px; justify-content:center; }
    #viewer{ padding:70px 16px; }
    .nav-btn{ width:38px; height:38px; font-size:16px; }
    #prev-btn{ left:8px; } #next-btn{ right:8px; }
    #thumb-panel{ padding-top:64px; width:140px; }
  }
</style>
</head>
<body>
  <div class="loading" id="loading">Loading —</div>

  <div class="topbar">
    <a class="back-link" href="index.html" id="back-link">&larr;<span class="back-text">&nbsp; Back</span></a>
    <div class="book-title" id="book-title"></div>
    <div class="topbar-right">
      <div class="page-indicator" id="page-indicator"></div>
      <button class="thumb-toggle" id="thumb-toggle" aria-label="頁面縮圖" title="頁面縮圖">
        <span class="icon">&#9638;</span><span class="label">PAGE</span>
      </button>
    </div>
  </div>

  <div id="viewer">
    <img id="page-img" alt="">
    <div id="page-pair">
      <img class="pair-img" data-slot="0" alt="">
      <div class="pair-divider"></div>
      <img class="pair-img" data-slot="1" alt="">
    </div>
  </div>

  <div class="nav-btn" id="prev-btn">&#8249;</div>
  <div class="nav-btn" id="next-btn">&#8250;</div>

  <div id="lightbox" role="dialog" aria-modal="true" aria-label="放大檢視">
    <button id="lb-close" aria-label="關閉">&#10005;</button>
    <div id="lb-wrap"></div>
    <div id="lb-hint">點一下放大 · 拖曳移動 · 滾輪縮放 · 點空白處關閉</div>
  </div>

  <div id="thumb-backdrop"></div>
  <aside id="thumb-panel"></aside>

<script>
  // Shuttered Light's PDF has page 1 and the last page as single portrait
  // covers, and every page in between pre-composed as a full two-page
  // landscape spread — so it's shown one image at a time, each at its own
  // natural shape (covers read as a single page, spreads read full-width,
  // no JS sizing math needed).
  //
  // Fragments of Light is laid out the normal print-book way instead:
  // every page is physically the same size, and the interior pages are
  // meant to be viewed two at a time as a spread, except the very first
  // (cover) and very last (back cover), which stand alone. `paired: true`
  // turns that into "units": [1], [2,3], [4,5], ..., [pages].
  const BOOKS = {
    "xiaode-photobook": { title: "Shuttered Light", dir: "images/xiaode-photobook", pages: 84 },
    "fragments-of-light": { title: "Fragments of Light", dir: "images/fragments-of-light", pages: 32, paired: true, ratio: 1489 / 1049 },
    "xiaode-report": { title: "截光・攝影 — 專題報告", dir: "images/xiaode-report", pages: 77 }
  };

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const cfg = BOOKS[id];

  function goTo(url) {
    document.body.classList.remove("is-ready");
    document.body.classList.add("is-leaving");
    setTimeout(() => { location.href = url; }, 380);
  }

  document.getElementById("back-link").addEventListener("click", (e) => {
    e.preventDefault();
    goTo("index.html");
  });

  function buildUnits(cfg) {
    if (!cfg.paired) {
      return Array.from({ length: cfg.pages }, (_, i) => [i + 1]);
    }
    const units = [[1]];
    for (let p = 2; p < cfg.pages; p += 2) units.push([p, p + 1]);
    units.push([cfg.pages]);
    return units;
  }

  if (!cfg) {
    document.body.innerHTML = '<p style="font-family:sans-serif;color:#0E1F1F;text-align:center;margin-top:40vh">找不到這本電子書。<a href="index.html" style="color:#2E9A9A">回書架</a></p>';
    requestAnimationFrame(() => document.body.classList.add("is-ready"));
  } else {
    document.getElementById("book-title").textContent = cfg.title;

    const total = cfg.pages;
    const units = buildUnits(cfg);
    let currentUnit = 0;

    const pageToUnit = [];
    units.forEach((pages, u) => pages.forEach((p) => { pageToUnit[p] = u; }));

    const singleImg = document.getElementById("page-img");
    const pairEl = document.getElementById("page-pair");
    const pairImgs = pairEl.querySelectorAll(".pair-img");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const thumbPanel = document.getElementById("thumb-panel");
    const thumbBackdrop = document.getElementById("thumb-backdrop");
    const thumbToggle = document.getElementById("thumb-toggle");

    function pageSrc(n) {
      return `${cfg.dir}/page-${String(n).padStart(2, "0")}.jpg`;
    }
    function thumbSrc(n) {
      return `${cfg.dir}/thumbs/page-${String(n).padStart(2, "0")}.jpg`;
    }
    function preload(n) {
      if (n < 1 || n > total) return;
      const im = new Image();
      im.src = pageSrc(n);
    }

    for (let p = 1; p <= total; p++) {
      const item = document.createElement("div");
      item.className = "thumb-item";
      item.dataset.page = p;
      item.innerHTML = `<img src="${thumbSrc(p)}" loading="lazy" alt=""><span class="thumb-num">${p}</span>`;
      item.addEventListener("click", () => showUnit(pageToUnit[p]));
      thumbPanel.appendChild(item);
    }
    const thumbItems = thumbPanel.querySelectorAll(".thumb-item");

    function setPanelOpen(open) {
      thumbPanel.classList.toggle("is-open", open);
      thumbBackdrop.classList.toggle("is-open", open);
      thumbToggle.classList.toggle("is-active", open);
      thumbToggle.classList.remove("pulse");
    }
    thumbToggle.addEventListener("click", () => setPanelOpen(!thumbPanel.classList.contains("is-open")));
    thumbBackdrop.addEventListener("click", () => setPanelOpen(false));
    thumbToggle.addEventListener("animationend", () => thumbToggle.classList.remove("pulse"));

    // First-time visual hint so the page-thumbnail button gets noticed —
    // a few gentle pulses, then it settles down for good.
    try {
      if (!sessionStorage.getItem("ebook-thumb-hint-seen")) {
        setTimeout(() => thumbToggle.classList.add("pulse"), 900);
        sessionStorage.setItem("ebook-thumb-hint-seen", "1");
      }
    } catch (e) {
      setTimeout(() => thumbToggle.classList.add("pulse"), 900);
    }

    function updateChrome() {
      const pages = units[currentUnit];
      const label = pages.length === 2 ? `${pages[0]}–${pages[1]}` : `${pages[0]}`;
      document.getElementById("page-indicator").textContent = `${label} / ${total}`;
      prevBtn.classList.toggle("is-disabled", currentUnit === 0);
      nextBtn.classList.toggle("is-disabled", currentUnit === units.length - 1);
      thumbItems.forEach((el) => {
        const isCurrent = pages.includes(Number(el.dataset.page));
        el.classList.toggle("is-current", isCurrent);
        if (isCurrent) el.scrollIntoView({ block: "nearest" });
      });
    }

    // Sizes the two-page-pair box in real pixels so both images share one
    // exact height (plain CSS can't fit a fixed-aspect *pair* the way
    // object-fit does for a single image).
    function sizePair() {
      const vw = window.innerWidth, vh = window.innerHeight;
      const availW = vw * (vw < 640 ? 0.94 : 0.82);
      const availH = vh * 0.82;
      const unitRatio = cfg.ratio * 2;
      const h = Math.min(availH, availW / unitRatio);
      const w = h * cfg.ratio;
      pairEl.style.height = Math.round(h) + "px";
      pairImgs.forEach((im) => { im.style.width = Math.round(w) + "px"; });
    }

    function reveal() {
      document.getElementById("loading").classList.add("hidden");
      requestAnimationFrame(() => document.body.classList.add("is-ready"));
    }

    function showUnit(newUnit, immediate) {
      newUnit = Math.max(0, Math.min(units.length - 1, newUnit));
      if (!immediate && newUnit === currentUnit) return;
      currentUnit = newUnit;
      updateChrome();
      const pages = units[currentUnit];
      preload(pages[0] - 1);
      preload((pages[1] || pages[0]) + 1);

      const apply = () => {
        if (pages.length === 2) {
          singleImg.classList.remove("is-visible");
          singleImg.style.display = "none";
          sizePair();
          let loaded = 0;
          const onEach = () => { if (++loaded === 2) { pairEl.classList.add("is-visible"); reveal(); } };
          pairImgs[0].onload = onEach;
          pairImgs[1].onload = onEach;
          pairEl.style.display = "flex";
          pairImgs[0].src = pageSrc(pages[0]);
          pairImgs[1].src = pageSrc(pages[1]);
        } else {
          pairEl.classList.remove("is-visible");
          pairEl.style.display = "none";
          singleImg.style.display = "block";
          singleImg.onload = () => { singleImg.classList.add("is-visible"); reveal(); };
          singleImg.src = pageSrc(pages[0]);
        }
      };

      if (immediate) {
        apply();
      } else {
        singleImg.classList.remove("is-visible");
        pairEl.classList.remove("is-visible");
        setTimeout(apply, 220);
      }
    }

    showUnit(0, true);

    prevBtn.addEventListener("click", () => showUnit(currentUnit - 1));
    nextBtn.addEventListener("click", () => showUnit(currentUnit + 1));

    // ---- lightbox: click a page to view it full-screen at native resolution ----
    const lb = document.getElementById("lightbox");
    const lbWrap = document.getElementById("lb-wrap");
    let lbS = 1, lbX = 0, lbY = 0, lbMoved = false;

    function lbApply() {
      lbWrap.style.transform = `translate(${lbX}px,${lbY}px) scale(${lbS})`;
      lb.classList.toggle("zoomed", lbS > 1);
    }
    function lbReset() { lbS = 1; lbX = 0; lbY = 0; lbApply(); }
    function lbRender() {
      lbWrap.innerHTML = units[currentUnit]
        .map((p) => `<img src="${pageSrc(p)}" draggable="false" alt="">`)
        .join("");
      lbReset();
    }
    function lbOpen() { lbRender(); lb.classList.add("open"); }
    function lbClose() { lb.classList.remove("open"); }
    function lbZoomAt(px, py, next) {
      const r = lb.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      next = Math.max(1, Math.min(6, next));
      if (next === 1) { lbS = 1; lbX = 0; lbY = 0; }
      else {
        const k = next / lbS;
        lbX = (px - cx) - k * (px - cx - lbX);
        lbY = (py - cy) - k * (py - cy - lbY);
        lbS = next;
      }
      lbApply();
    }

    [singleImg, ...pairImgs].forEach((im) => { im.style.cursor = "zoom-in"; im.addEventListener("click", lbOpen); });
    document.getElementById("lb-close").addEventListener("click", lbClose);
    lb.addEventListener("wheel", (e) => {
      e.preventDefault();
      lbZoomAt(e.clientX, e.clientY, lbS * (e.deltaY < 0 ? 1.18 : 1 / 1.18));
    }, { passive: false });

    let drag = null;
    lb.addEventListener("pointerdown", (e) => {
      if (e.target.closest("#lb-close")) return;
      drag = { x: e.clientX, y: e.clientY, ox: lbX, oy: lbY, onImg: e.target.tagName === "IMG" };
      lbMoved = false;
      lb.setPointerCapture(e.pointerId);
    });
    lb.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) lbMoved = true;
      if (lbS > 1 && lbMoved) { lbX = drag.ox + dx; lbY = drag.oy + dy; lbApply(); }
    });
    lb.addEventListener("pointerup", (e) => {
      const wasDrag = lbMoved, onImg = drag && drag.onImg;
      drag = null;
      if (wasDrag || e.target.closest("#lb-close")) return;
      if (lbS > 1) lbReset();
      else if (onImg) lbZoomAt(e.clientX, e.clientY, 2.5);
      else lbClose();
    });

    window.addEventListener("keydown", (e) => {
      const open = lb.classList.contains("open");
      if (e.key === "ArrowLeft") { showUnit(currentUnit - 1); if (open) lbRender(); }
      if (e.key === "ArrowRight") { showUnit(currentUnit + 1); if (open) lbRender(); }
      if (e.key === "Escape") { if (open) lbClose(); else goTo("index.html"); }
    });

    let resizeTimer;
    window.addEventListener("resize", () => {
      if (units[currentUnit].length !== 2) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(sizePair, 150);
    });

    // fallback: reveal the page anyway after 4s even if the image is slow
    setTimeout(reveal, 4000);
  }
</script>
</body>
</html>
